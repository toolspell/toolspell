<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Applies the stored theme before the first paint, as syncTheme in src/theme.ts does after.
         Keep it one attribute-less inline script: the server allows it by its hash. -->
    <script>
      (() => {
        const themes = { light: ["light", "#ffffff"], dark: ["dark", "#0a0a0a"] };
        let preference = "system";
        try {
          preference = JSON.parse(localStorage.getItem("toolspell:theme") ?? '"system"');
        } catch {}
        const id =
          typeof preference === "string" && Object.hasOwn(themes, preference)
            ? preference
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        const [appearance, chrome] = themes[id];
        const root = document.documentElement;
        root.dataset.theme = id;
        root.classList.toggle("dark", appearance === "dark");
        root.style.colorScheme = appearance;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", chrome);
      })();
    </script>
    <title>ToolSpell</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <!-- Shown until React mounts, so a slow boot is never a blank page. -->
      <div
        id="boot-shell"
        class="flex min-h-screen items-center justify-center text-sm text-muted-foreground"
      >
        Loading ToolSpell…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
