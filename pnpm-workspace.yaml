packages:
  - apps/*
  - packages/*
  - oxlint-plugin-toolspell
  - scripts

catalogMode: prefer

allowBuilds:
  electron: true
  esbuild: true

# Unmet peers fail resolution, so a pin outside a dependency's peer range is
# caught when the lockfile changes instead of scrolling past as a warning.
strictPeerDependencies: true

# pnpm 12 links agent skills that dependencies ship into .claude/skills once
# approved. We curate our own skills, so deny these to keep installs quiet.
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false

catalog:
  "@base-ui/react": ^1.9.0
  "@effect/atom-react": 4.1.5
  "@effect/platform-node": 4.1.5
  "@effect/sql-sqlite-node": 4.1.5
  "@effect/vitest": 4.1.5
  "@fontsource-variable/inter": ^5.3.0
  "@oxlint/plugins": 1.94.0
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.169.0
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  # Must match the Vitest that vite-plus bundles.
  "@vitest/browser-playwright": 5.1.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  acorn: 8.19.0
  effect: 4.1.5
  electron: 45.4.1
  lucide-react: ^0.564.0
  playwright: 1.65.1
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: ^4.23.0
  tailwindcss: 4.3.5
  tw-animate-css: ^1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
