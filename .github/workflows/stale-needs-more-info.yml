# Labels an issue `stale` once it waited 7 days on the reporter (needs-more-info) with no update.
# Nothing closes: a maintainer filters by the label and decides. Adapted from T3 Code's
# stale-needs-more-info.yml (MIT), which closes instead.
name: Label stale needs-more-info issues

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: Label unanswered issues
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # actions/stale keeps its progress between runs in the Actions cache.
      actions: write
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: needs-more-info
          days-before-issue-stale: 7
          days-before-issue-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          # No stale-issue-message: the label goes on without a comment.
          stale-issue-label: stale
          remove-issue-stale-when-updated: true
          operations-per-run: 200
