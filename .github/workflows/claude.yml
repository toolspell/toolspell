# Runs Claude Code when the maintainer mentions @claude in an issue, a PR, or a review.
#
# It runs on the maintainer's Claude subscription (secret CLAUDE_CODE_OAUTH_TOKEN, from
# `claude setup-token`), so only the account named in the repository variable CLAUDE_ALLOWED_ACTOR
# can start it; unset, nobody can. The action also requires write access and skips bots and fork
# PRs by default; keep allowed_non_write_users, allowed_bots, and allow_fork_prs unset.
#
# The workflow's own token can read code and CI results and write comments, but cannot push.
# Comments therefore come from github-actions[bot], not the Claude app.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    name: Claude
    if: >-
      github.actor == vars.CLAUDE_ALLOWED_ACTOR && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
