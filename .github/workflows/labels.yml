# Creates and updates the labels defined in .github/labels.json. It never deletes a label.
# Adapted from T3 Code's issue-labels.yml (MIT).
name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/labels.cjs
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels
      cancel-in-progress: false
    steps:
      - name: Checkout label definitions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Sync labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await require("./.github/scripts/labels.cjs").sync({ github, context, core });
