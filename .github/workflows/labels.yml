# Creates and updates the labels defined in .github/labels.json. It never deletes a label.
# Adapted from T3 Code's issue-labels.yml (MIT).
name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/labels.cjs
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels
      cancel-in-progress: false
    steps:
      - name: Checkout label definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Sync labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./.github/scripts/labels.cjs").sync({ github, context, core });
