# Deterministic PR rules from CONTRIBUTING.md: the open PR limit, the conflict window, and the 72
# hour close window that follows a triage notice. See .github/scripts/pr-limits.cjs.
# Adapted from T3 Code's pr-limits.yml (MIT).
#
# Nothing is labeled, commented on, or closed until the repository variable PR_LIMITS_ENFORCE is
# "true". Until then every run logs what it would do. A sweep reads the variable once when it
# starts; to stop one, cancel the run.
name: PR Limits

on:
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what the sweep would do without labeling, commenting, or closing.
        type: boolean
        default: true

permissions: {}

jobs:
  open-limit:
    name: Open PR limit
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # pull_request_target has a write token. Load the script from the default branch and never
      # run PR code.
      - name: Checkout trusted scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Close PRs over the limit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DRY_RUN: ${{ vars.PR_LIMITS_ENFORCE != 'true' }}
        with:
          script: |
            const limits = require("./.github/scripts/pr-limits.cjs");
            await limits.enforceOpenLimit({ github, context, core, dryRun: process.env.DRY_RUN === "true" });

  sweep:
    name: Conflict and close windows
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    # The sweep waits up to two and a half minutes for GitHub's mergeability answers.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: pr-limits-sweep
      cancel-in-progress: false
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Request rebases and close what went unanswered
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DRY_RUN: ${{ vars.PR_LIMITS_ENFORCE != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        with:
          script: |
            const limits = require("./.github/scripts/pr-limits.cjs");
            await limits.sweep({ github, context, core, dryRun: process.env.DRY_RUN === "true" });
