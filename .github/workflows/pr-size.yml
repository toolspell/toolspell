# Labels each PR by effective changed lines and comments when it grows the test suite noticeably.
# See .github/scripts/pr-size.cjs. Adapted from T3 Code's pr-size.yml (MIT).
#
# pull_request_target has a write token. The checkout is the default branch; the PR's commits are
# fetched only as git data to diff. Never add installs, builds, tests, or caches here.
name: PR Size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

# Run level, not job level: a run joins the group when its event arrives, so a newer push always
# supersedes an older one. A job joins only when it is queued, a second or two later and not
# always in event order, so an older push's job could cancel the newer one's and label a stale diff.
concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # Full history for the merge base. Without persisted credentials the PR head is fetched
      # anonymously, which works because the repository is public.
      - name: Checkout trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Sync size label and test delta comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require("./.github/scripts/pr-size.cjs").run({ github, context, core });
