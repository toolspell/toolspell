# Adapted from T3 Code's CI (MIT): detect affected packages, run lint, typecheck+build
# and tests side by side, then one required `Check` job that branch protection targets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Electron's binary is only needed to run the desktop app, not to check it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.changes.outputs.all }}
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # A pull request's merge commit has the base as its first parent. Pushes to main run everything.
      - id: changes
        run: node scripts/ci-changes.ts ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: vp fmt --check
      - run: vp lint --report-unused-disable-directives
      - run: vp run knip

  typecheck_build:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    env:
      WEB: ${{ needs.changes.outputs.all == 'true' || contains(needs.changes.outputs.packages, '@toolspell/web') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Typecheck
        env:
          ALL: ${{ needs.changes.outputs.all }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [[ "$ALL" == "true" ]]; then vp run -r --cache typecheck; exit; fi
          filters=(); for p in $PACKAGES; do filters+=(--filter "$p"); done
          vp run --cache --parallel "${filters[@]}" typecheck
      - run: vp run build
      # Source-level browser tests never run the production chunk graph, where boot breaks hide.
      - if: env.WEB == 'true'
        uses: ./.github/actions/chromium
      - name: Boot the built web client
        if: env.WEB == 'true'
        run: vp run --filter @toolspell/web verify:boot

  test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      WEB: ${{ needs.changes.outputs.all == 'true' || contains(needs.changes.outputs.packages, '@toolspell/web') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The web package's browser project runs its tests in headless Chromium.
      - if: env.WEB == 'true'
        uses: ./.github/actions/chromium
      - name: Test
        env:
          ALL: ${{ needs.changes.outputs.all }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [[ "$ALL" == "true" ]]; then vp run -r test; exit; fi
          # Docs-only changes still run the scripts package, which holds the agent-docs check.
          filters=(--filter @toolspell/scripts); for p in $PACKAGES; do filters+=(--filter "$p"); done
          vp run "${filters[@]}" test

  check:
    if: ${{ always() }}
    needs: [changes, lint, typecheck_build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped for an unaffected change
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
          echo "$RESULTS" | jq -e '.changes.result == "success"'
