# Checks that the PR title is a Conventional Commit subject; see .github/scripts/pr-title.cjs.
# Its own workflow, so a title edit reruns only this check, not CI.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      # The title goes through the environment, never into the script text.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/pr-title.cjs
