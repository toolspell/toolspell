name: Setup
description: Install Vite+ and the workspace dependencies.
runs:
  using: composite
  steps:
    - name: Setup Vite+
      # Pinned like T3 Code's CI; bump deliberately.
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
      with:
        node-version-file: package.json
        cache: true
        run-install: false
    - name: Install
      shell: bash
      env:
        # Slow registry or GitHub downloads fail the step instead of hanging the job.
        VP_DOWNLOAD_TIMEOUT: "120"
      run: vp i --frozen-lockfile
