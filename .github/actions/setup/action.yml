# Adapted from T3 Code's .github/actions/setup-ci-deps (MIT). Unlike T3 Code, only runs on main
# save caches: a PR's caches would serve only that PR.
name: Setup
description: Install Vite+ and the workspace dependencies, from cache where possible.
inputs:
  save-cache:
    description: Set to "false" in all but one job of a run, so parallel jobs do not each upload the same caches.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # ~/.vite-plus holds vp, Node.js and pnpm. A cache entry never updates, so its key names all three.
    - name: Resolve versions
      id: vp
      shell: bash
      run: |
        echo "version=$(sed -nE 's/^  vite-plus: ([0-9][^ ]*)$/\1/p' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"
        echo "node=$(jq -r '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

    - name: Restore Vite+
      id: vp_cache
      # Pinned like T3 Code's CI; bump deliberately.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.vite-plus
        key: vite-plus-home-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vp.outputs.version }}-node${{ steps.vp.outputs.node }}-pnpm${{ steps.vp.outputs.pnpm }}

    # setup-vp always runs the installer, which fetches vp from npm even when this version is
    # installed. A hit already has everything, so it skips setup-vp and npm outages cannot fail it.
    - name: Use cached Vite+
      if: steps.vp_cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        NODE_VERSION: ${{ steps.vp.outputs.node }}
      run: |
        echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
        "$HOME/.vite-plus/bin/vp" env use "$NODE_VERSION"

    - name: Setup Vite+
      if: steps.vp_cache.outputs.cache-hit != 'true'
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      env:
        # Slow registry or GitHub downloads fail the step instead of hanging the job.
        VP_DOWNLOAD_TIMEOUT: "120"
      with:
        node-version-file: package.json
        cache: false
        run-install: false

    - name: Resolve pnpm store
      id: pnpm_store
      shell: bash
      run: |
        echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
        metadata_dir="${pnpm_config_cache_dir:-$RUNNER_TEMP/pnpm-metadata}"
        echo "pnpm_config_cache_dir=$metadata_dir" >> "$GITHUB_ENV"
        echo "verified=$metadata_dir/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      id: pnpm_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
        restore-keys: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-

    # pnpm accepts an earlier pass for the same lockfile and policy, so a cached record skips
    # fetching registry metadata for every package.
    - name: Restore lockfile verification
      id: pnpm_verified
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.verified }}
        key: pnpm-verified-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}

    - name: Install
      shell: bash
      env:
        VP_DOWNLOAD_TIMEOUT: "120"
      run: vp i --frozen-lockfile

    - name: Save Vite+
      if: inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.vp_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.vite-plus
        key: ${{ steps.vp_cache.outputs.cache-primary-key }}

    - name: Save pnpm store
      if: inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.path }}
        key: ${{ steps.pnpm_cache.outputs.cache-primary-key }}

    - name: Save lockfile verification
      if: inputs.save-cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm_verified.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm_store.outputs.verified }}
        key: ${{ steps.pnpm_verified.outputs.cache-primary-key }}
